[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/fred/*"
  to = "https://api.stlouisfed.org/fred/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/bls/*"
  to = "https://api.bls.gov/publicAPI/v2/:splat"
  status = 200
  force = true
